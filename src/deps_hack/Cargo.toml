[package]
name = "deps_hack"
version = "0.1.0"
edition = "2021"

[features]
default = ["openssl-tls", "ws", "runtime", "k8s-openapi/v1_33"]
openssl-tls = ["kube/client", "kube/openssl-tls"]
rustls-tls = ["kube/client", "kube/rustls-tls"]
runtime = ["kube/runtime"]
ws = ["kube/ws"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
kube = { version = "2", default-features = false, features = ["admission", "derive", "client"] }
k8s-openapi = { version = "0.26.0", default-features = false, features = ["schemars"] }
tokio = { version = "1.14.0", features = ["full"] }
serde = { version = "1.0.130", features = ["derive"] }
serde_json = "1.0.68"
serde_yaml = "0.9.19"
schemars = "1"
thiserror = "1.0.29"
tracing = "0.1.36"
tracing-subscriber = "0.3.17"
anyhow = "1.0.71"
futures = "0.3.17"
base64 = "0.13.0"
rand = "0.8"
zookeeper = "0.8"
chrono = "0.4.19"
proptest = "1.4.0"
warp = { version = "0.3", features = ["tls"] }
